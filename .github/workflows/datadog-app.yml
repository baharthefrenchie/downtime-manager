name: Datadog App

# Pull requests: typecheck, lint, unit tests and a production build (no secrets needed).
# Pushes to main: the same checks, then build, upload and publish the app live to every
# Datadog org listed as a deploy target.
#
# Deploy targets are GitHub environments, one per Datadog org. Each holds that org's
# DATADOG_API_KEY and DATADOG_APP_KEY secrets (repository secrets are used if the
# environment has none) and, when needed, a DATADOG_SITE variable: the org's site
# (datadoghq.eu) or its custom subdomain on that site (demo.datadoghq.com), so links in
# the app open that org's own host. List the environments in the repository variable DATADOG_DEPLOY_TARGETS,
# e.g. ["datadog-production", "datadog-eu"]. Without it, only datadog-production deploys.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Deploy only to this environment (leave empty for all deploy targets)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Matches the Datadog Apps backend runtime.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build (no upload)
        run: npm run build

  deploy:
    name: Deploy to ${{ matrix.target }}
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      # One org failing (for example, an expired key) doesn't stop the others.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target && format('["{0}"]', inputs.target) || vars.DATADOG_DEPLOY_TARGETS || '["datadog-production"]') }}
    # Add required reviewers to an environment in GitHub to gate deploys to that org.
    environment: ${{ matrix.target }}
    # Never run two deploys to the same org at once; a newer push waits for the current one.
    concurrency:
      group: datadog-app-deploy-${{ matrix.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # DATADOG_SITE may be an org subdomain (demo.datadoghq.com). The deploy gets the bare
      # site (datadoghq.com); the app's links get the full value.
      - name: Resolve site
        id: site
        env:
          SITE: ${{ vars.DATADOG_SITE }}
        run: |
          full=$(printf '%s' "$SITE" | tr '[:upper:]' '[:lower:]' | sed -E 's#^https?://##; s#[/?#].*$##')
          bare="$full"
          for known in us3.datadoghq.com us5.datadoghq.com ap1.datadoghq.com ap2.datadoghq.com us2.ddog-gov.com datadoghq.com datadoghq.eu ddog-gov.com; do
            if [ "$full" = "$known" ]; then bare="$known"; break; fi
            case "$full" in *".$known") bare="$known"; break ;; esac
          done
          echo "Deploying to site '${bare:-from datadog-app.config.json}'; app links use '${full:-the site default}'."
          echo "bare=$bare" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: DataDog/apps-github-action@2c2495d48c9569b6eace166a5d43e60d9e5b81da # v0.1.1
        env:
          DD_SITE: ${{ steps.site.outputs.bare }}
          # Read by vite.config.ts for in-app links (the CLI resets DD_SITE to the bare site).
          APP_LINK_SITE: ${{ steps.site.outputs.full }}
        with:
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
          datadog-app-key: ${{ secrets.DATADOG_APP_KEY }}
          datadog-site: ${{ steps.site.outputs.bare }}
          app-directory: .
